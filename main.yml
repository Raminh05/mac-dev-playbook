---
- name: Configure host.
  hosts: all

  vars_files:
    - default.config.yml

  # Asked once up front and used for every task that needs root, including
  # Homebrew apps whose installers call sudo (which --ask-become-pass can't
  # reach). Skipped when passed in with -e ansible_become_password=...
  vars_prompt:
    - name: ansible_become_password
      prompt: "macOS account password (for sudo)"
      private: true

  handlers:
    - name: Restart Dock
      command: killall Dock

    - name: Restart Finder
      command: killall Finder

    - name: Restart Control Center
      command: killall ControlCenter

  pre_tasks:
    - name: Include playbook configuration.
      include_vars: "{{ item }}"
      with_fileglob:
        - "{{ playbook_dir }}/config.yml"
      tags: ['always']

    # Installed in step 1 of the README (and by the Homebrew installer).
    - name: Check the Command Line Tools are installed.
      command: xcode-select -p
      changed_when: false
      tags: ['always']

  roles:
    # Tagged with every tag that needs Homebrew, so any one of them can run
    # first on a fresh Mac.
    - role: geerlingguy.mac.homebrew
      tags:
        - homebrew
        - dock
        - fish
        - rust
        - python
        - timemachine
    - role: geerlingguy.mac.mas
      when: (mas_installed_apps | length > 0) or (mas_installed_app_ids | length > 0)
      tags: ['mas']

  tasks:
    - import_tasks: tasks/homebrew-apps.yml
      tags: ['homebrew']

    - import_tasks: tasks/sudoers.yml
      when: configure_sudoers
      tags: ['sudoers']

    - import_tasks: tasks/macos.yml
      tags: ['macos']

    - import_tasks: tasks/dock.yml
      when: configure_dock
      tags: ['dock']

    - import_tasks: tasks/fish.yml
      when: configure_fish
      tags: ['fish']

    - import_tasks: tasks/zed.yml
      when: configure_zed
      tags: ['zed']

    - import_tasks: tasks/rust.yml
      when: configure_rust
      tags: ['rust']

    - import_tasks: tasks/python.yml
      when: configure_python
      tags: ['python']

    - import_tasks: tasks/git.yml
      when: configure_git
      tags: ['git']

    - import_tasks: tasks/ssh.yml
      when: configure_ssh
      tags: ['ssh']

    - import_tasks: tasks/touchid-sudo.yml
      when: configure_touchid_sudo
      tags: ['touchid']

    - import_tasks: tasks/timemachine.yml
      when: configure_timemachine
      tags: ['timemachine']

    - import_tasks: tasks/spotlight.yml
      when: configure_spotlight
      tags: ['spotlight']

    - import_tasks: tasks/extra-packages.yml
      tags: ['extra-packages']

    - name: Run post-provision task files in a block.
      tags: ['post']
      block:
        - name: Run configured post-provision ansible task files.
          include_tasks: "{{ outer_item }}"
          loop_control:
            loop_var: outer_item
          with_fileglob: "{{ post_provision_tasks | default(omit) }}"
