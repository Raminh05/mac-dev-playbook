---
# Also listed in homebrew_dev; installed here so `--tags rust` works alone.
# rustup is keg-only, so its bin dir must be added to PATH explicitly.
- name: Ensure rustup is installed.
  community.general.homebrew:
    name: rustup
    state: present

- name: Ensure fish conf.d directory exists.
  file:
    path: "{{ ansible_env.HOME }}/.config/fish/conf.d"
    state: directory
    mode: "0755"

- name: Add Homebrew rustup to the fish PATH.
  copy:
    dest: "{{ ansible_env.HOME }}/.config/fish/conf.d/homebrew-rustup.fish"
    content: |
      # Managed by mac-dev-playbook.
      fish_add_path --path --move --prepend {{ rustup_bin_dir }}
    mode: "0644"

- name: Ensure the default Rust toolchain is installed and selected.
  command: "{{ rustup_bin_dir }}/rustup default {{ rust_default_toolchain }}"
  register: rustup_default
  changed_when: "'unchanged' not in rustup_default.stdout"

- name: Install Rust toolchain components.
  command: "{{ rustup_bin_dir }}/rustup component add {{ rust_components | join(' ') }}"
  register: rustup_components
  changed_when: "'downloading component' in rustup_components.stderr"
  when: rust_components | length > 0
