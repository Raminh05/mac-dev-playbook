---
# Also listed in brew_shell; installed here so `--tags fish` works alone.
- name: Ensure fish is installed.
  community.general.homebrew:
    name: fish
    state: present

- name: Ensure fish is listed in /etc/shells.
  lineinfile:
    path: /etc/shells
    line: "{{ fish_path }}"
  become: true

- name: Set fish as the login shell.
  user:
    name: "{{ ansible_facts.user_id }}"
    shell: "{{ fish_path }}"
  become: true

- name: Ensure fish config directories exist.
  file:
    path: "{{ ansible_facts.env.HOME }}/.config/fish/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - conf.d
    - functions

- name: Install fish config and functions.
  copy:
    src: "files/fish/{{ item }}"
    dest: "{{ ansible_facts.env.HOME }}/.config/fish/{{ item }}"
    mode: "0644"
    backup: true
  loop:
    - config.fish
    - functions/htop.fish
    - functions/neofetch.fish
