---
# Keep CI installs small: one formula and one cask, other categories empty.
brew_dev:
  packages:
    - python@3.15
  casks:
    - zed
brew_shell: {}
brew_networking: {}
brew_media: {}
brew_photography: {}
brew_office: {}
brew_gaming: {}
install_rosetta: false
direct_app_melonds: {}
direct_app_makemkv: {}
brew_maker: {}
brew_personal: {}

# Skip slow or host-specific setup in CI.
configure_rust: false
configure_python: false
configure_timemachine: false
configure_touchid_sudo: false
